<body>
<title>แผนที่ลูกค้า SSC</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.legend { flex: none; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 7px; }
.lg-row { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.lg-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding-left: 9px; border-left: 2px solid var(--line-firm); }
.lg-cap { font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.legend button {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2);
  background: none; border: none; cursor: pointer; padding: 2px 0;
}
.legend button.mini { font-size: 11.5px; }
.legend button.off { opacity: .32; text-decoration: line-through; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.kvlist { margin: 0; }
.kv dd.coord { font-size: 12.5px; }
svg.chip { width: 16px; height: 16px; flex: none; display: block; }
.row svg.chip { width: 18px; height: 18px; }

.list { flex: 1 1 auto; min-height: 60px; overflow-y: auto; padding: 6px; }
.row {
  display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent;
  background: none; color: inherit; margin-bottom: 2px;
}
.row:hover { background: var(--sunken); }
.row[aria-current="true"] { background: var(--sunken); border-color: var(--p1); }
.row .txt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
.row .n { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { display: block; font-size: 11.5px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blank { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.7; }

/* ---------- แผนที่ ---------- */
.mapwrap { flex: 1; position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--page); }
.leaflet-container { background: var(--page); font-family: inherit; }
.pin { filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
.pin svg { display: block; }
.pin .shell { stroke: var(--surface); stroke-width: 1.5; }
.me { width: 14px; height: 14px; border-radius: 50%; background: var(--p1); border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line-firm), 0 2px 6px rgba(0,0,0,.4); }
.fab {
  position: absolute; right: 12px; bottom: 22px; z-index: 800;
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-firm);
  background: var(--surface); color: var(--ink); font-size: 17px; cursor: pointer;
  box-shadow: var(--shadow-1); display: flex; align-items: center; justify-content: center;
}
.fab:hover { border-color: var(--p1); }
#basemap { bottom: 70px; }
/* ชื่อจังหวัดบนแผนที่ */
.plabel { pointer-events: none; }
.plabel b {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%);
  font-weight: 500; white-space: nowrap; color: var(--ink-2);
  text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 3px var(--land), 0 0 6px var(--land);
}
.labels-sm .plabel b { font-size: 8.5px; }
.labels-md .plabel b { font-size: 10.5px; }
.labels-lg .plabel b { font-size: 12.5px; }
.plabel.on b { color: var(--p1); font-weight: 700; text-shadow: 0 0 3px var(--land-hi), 0 0 3px var(--land-hi), 0 0 6px var(--land-hi); }

/* ---------- การ์ดรายละเอียด ---------- */
.card {
  position: absolute; top: 12px; right: 12px; width: 290px; max-width: calc(100% - 24px);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: var(--shadow-2); z-index: 850; overflow: hidden; display: none;
}
.card.on { display: block; }
.card-h { padding: 13px 15px 11px; border-bottom: 1px solid var(--line); position: relative; }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; color: #fff; padding: 3px 9px; border-radius: 999px; letter-spacing: .02em; }
.card-h h2 { margin: 8px 0 1px; font-size: 16.5px; font-weight: 700; padding-right: 26px; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.x {
  position: absolute; top: 11px; right: 11px; width: 24px; height: 24px; border-radius: 7px;
  border: none; background: var(--sunken); color: var(--ink-2); cursor: pointer; font-size: 15px; line-height: 1;
}
.x:hover { color: var(--ink); }
.card-b { padding: 10px 15px 14px; }
.kv { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.kv:last-of-type { border-bottom: none; }
.kv dt { width: 62px; flex: none; color: var(--muted); font-size: 12px; margin: 0; }
.kv dd { margin: 0; font-weight: 500; min-width: 0; word-break: break-word; }
.kv a { color: var(--p1); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--p1) 40%, transparent); }
.nav {
  display: flex; align-items: center; justify-content: center; gap: 7px; width: 100%;
  margin-top: 11px; padding: 10px; background: var(--p1); color: #fff; border-radius: var(--r);
  font-size: 13.5px; font-weight: 700; text-decoration: none;
}
.nav:hover { filter: brightness(1.08); }
.card-acts { display: flex; gap: 7px; margin-top: 7px; }
.card-acts .btn { flex: 1; padding: 7px; font-size: 12.5px; }

/* ---------- ฟอร์ม ---------- */
.veil {
  display: none; position: fixed; inset: 0; background: rgba(6,12,18,.55);
  z-index: 4000; align-items: center; justify-content: center; padding: 14px;
}
.veil.on { display: flex; }
.sheet {
  background: var(--surface); border-radius: 16px; width: 440px; max-width: 100%; max-height: 92vh;
  display: flex; flex-direction: column; box-shadow: var(--shadow-2); overflow: hidden;
}
.sheet-h { padding: 15px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.sheet-h h2 { margin: 0; font-size: 16px; font-weight: 700; flex: 1; }
.sheet-b { padding: 15px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.ff { display: flex; flex-direction: column; gap: 4px; }
.ff[hidden] { display: none; }
.ff > label { font-size: 11.5px; font-weight: 600; color: var(--ink-2); }
.ff .req { color: var(--danger); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bad input, .bad select { border-color: var(--danger); }
.msg { display: none; font-size: 11.5px; color: var(--danger); font-weight: 600; }
.msg.on { display: block; }
.pick {
  width: 100%; padding: 9px; border: 1px dashed var(--p1); border-radius: 8px; cursor: pointer;
  background: var(--sunken); color: var(--p1); font-size: 13px; font-weight: 600;
}
.pick.set { border-style: solid; }
.tip { font-size: 11.5px; color: var(--muted); }
/* รายการที่อยู่ที่ค้นเจอ */
.hits { display: flex; flex-direction: column; gap: 5px; margin-top: 2px; }
.hits[hidden] { display: none; }
.hit {
  text-align: left; width: 100%; padding: 8px 10px; border: 1px solid var(--line-firm);
  border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 12.5px;
  line-height: 1.45; cursor: pointer;
}
.hit:hover { border-color: var(--p1); background: var(--sunken); }
.hit b { display: block; font-size: 13px; margin-bottom: 1px; }
.hit span { color: var(--muted); }
.tip.bad { color: var(--danger); font-weight: 600; }
.tip.ok { color: var(--good); font-weight: 600; }

/* ---------- ยืนยัน / แจ้งเตือน ---------- */
.ask { display: none; position: fixed; inset: 0; background: rgba(6,12,18,.6); z-index: 5000; align-items: center; justify-content: center; padding: 14px; }
.ask.on { display: flex; }
.ask-box { background: var(--surface); border-radius: 14px; padding: 20px; width: 330px; max-width: 100%; box-shadow: var(--shadow-2); }
.ask-box p { margin: 0 0 16px; font-size: 14.5px; line-height: 1.55; }
.ask-box .btn-row .btn { padding: 9px; }
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 14px);
  background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; z-index: 6000; box-shadow: var(--shadow-2);
  opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: 92vw; text-align: center;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.ok  { background: var(--good); color: #fff; }
/* แถบแจ้งเมื่อเปิดแอปไม่สำเร็จ */
.fatal {
  position: fixed; inset: 0; z-index: 9000; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: var(--page); color: var(--ink); text-align: center;
}
.fatal.on { display: flex; }
.fatal .box { max-width: 420px; }
.fatal h2 { margin: 0 0 8px; font-size: 19px; }
.fatal p { margin: 0 0 6px; color: var(--ink2, #4a5b6b); font-size: 14.5px; line-height: 1.6; }
.fatal code { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); word-break: break-word; }
.fatal button {
  margin-top: 14px; border: none; border-radius: 10px; background: var(--p1); color: #fff;
  font-family: inherit; font-size: 14px; font-weight: 700; padding: 10px 22px; cursor: pointer;
}
.toast.bad { background: var(--danger); color: #fff; }
.pinning {
  display: none; position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: var(--p1); color: #fff; padding: 9px 15px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; z-index: 3000; box-shadow: var(--shadow-2); align-items: center; gap: 10px;
}
.pinning.on { display: flex; }
.pinning button { background: rgba(255,255,255,.22); color: #fff; border: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px; font-weight: 600; }

:focus-visible { outline: 2px solid var(--p1); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- มือถือ ---------- */
@media (max-width: 820px) {
  .kpis { display: none; }
  .main { flex-direction: column; }
  .rail {
    width: 100%; border-right: none; position: absolute; left: 0; right: 0; bottom: 0;
    max-height: 62vh; border-top: 1px solid var(--line-firm);
    border-radius: 16px 16px 0 0; box-shadow: var(--shadow-2); z-index: 900;
  }
  .rail.tuck { transform: translateY(calc(100% - 52px)); }
  .grab { display: flex !important; }
  /* บนมือถือ แถบรายชื่อกินพื้นที่ด้านล่าง จึงย้ายปุ่มลอยไปมุมขวาบน */
  .card { top: 10px; left: 10px; right: 62px; width: auto; }
  .leaflet-control-zoom { display: none; }   /* บนมือถือใช้นิ้วซูมได้ ไม่ต้องมีปุ่ม */
  .fab { top: 10px; right: 10px; bottom: auto; }
  #basemap { top: 58px; right: 10px; bottom: auto; }
}
.grab {
  flex: none;
  display: none; align-items: center; justify-content: center; gap: 8px;
  padding: 9px; border: none; background: var(--surface); color: var(--ink-2);
  font-size: 12.5px; font-weight: 600; cursor: pointer; border-radius: 16px 16px 0 0;
  border-bottom: 1px solid var(--line);
}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>แผนที่ลูกค้า SSC</h1>
      <span class="mode" id="mode">กำลังเชื่อมต่อ…</span>
      <span class="ver" title="เวอร์ชันของโค้ด">v10</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="v num" id="k-all">0</div><div class="l">ลูกค้าทั้งหมด</div></div>
      <div class="kpi"><div class="v num" id="k-prov">0</div><div class="l">จังหวัด</div></div>
      <div class="kpi"><div class="v num" id="k-show">0</div><div class="l">แสดงอยู่</div></div>
    </div>
  </header>

  <div class="main">
    <aside class="rail" id="rail">
      <button class="grab" id="grab">▲ รายชื่อลูกค้า</button>
      <div class="rail-top">
        <button class="btn primary" id="add">เพิ่มลูกค้า</button>
        <div class="btn-row">
          <button class="btn" id="refresh" title="ดึงข้อมูลล่าสุดที่เพื่อนร่วมงานเพิ่งบันทึก">รีเฟรช</button>
          <button class="btn" id="opensheet" title="เปิดตารางข้อมูลใน Google Sheets">เปิดชีต</button>
        </div>
        <div class="btn-row">
          <button class="btn" id="imp">นำเข้า</button>
          <button class="btn" id="exp">ส่งออก</button>
        </div>
        <input id="file" type="file" accept="application/json,.json" hidden>
      </div>
      <div class="filters">
        <label class="fl"><span>ค้นหา</span><input id="q" type="search" placeholder="ชื่อ / เบอร์ / รุ่น / SSC"></label>
        <label class="fl"><span>เขต</span><select id="f-zone"><option value="">ทุกเขต</option></select></label>
        <label class="fl"><span>SSC</span><select id="f-ssc"><option value="">ทุก SSC</option></select></label>
      </div>
      <div class="legend" id="legend"></div>
      <div class="list" id="list"></div>
    </aside>

    <div class="mapwrap">
      <div id="map"></div>
      <button class="fab" id="basemap" title="สลับแผนที่ถนน / จังหวัด">🛣️</button>
      <button class="fab" id="locate" title="ตำแหน่งของฉัน">◎</button>
      <article class="card" id="card">
        <div class="card-h">
          <button class="x" id="card-x" aria-label="ปิด">×</button>
          <span class="tag" id="c-tag"></span>
          <h2 id="c-name"></h2>
          <div class="sub" id="c-sub"></div>
        </div>
        <div class="card-b" id="c-body"></div>
      </article>
    </div>
  </div>
</div>

<div class="pinning" id="pinning">คลิกตำแหน่งลูกค้าบนแผนที่ <button id="pin-x">ยกเลิก</button></div>

<div class="veil" id="veil">
  <div class="sheet">
    <div class="sheet-h"><h2 id="sheet-title">เพิ่มลูกค้าใหม่</h2><button class="x" id="sheet-x" aria-label="ปิด" style="position:static">×</button></div>
    <div class="sheet-b">
      <div class="ff" id="w-name">
        <label for="i-name">ชื่อลูกค้า <span class="req">*</span></label>
        <input id="i-name" type="text" placeholder="เช่น คุณสมชาย ใจดี">
        <div class="msg" id="m-name">กรุณากรอกชื่อลูกค้า</div>
      </div>
      <div class="ff"><label for="i-phone">เบอร์โทรศัพท์</label><input id="i-phone" type="tel" placeholder="081-234-5678"></div>
      <div class="ff">
        <label for="i-addr">ที่อยู่</label>
        <textarea id="i-addr" rows="2" placeholder="เช่น 99 หมู่ 4 ต.บ้านกร่าง อ.เมือง พิษณุโลก"></textarea>
        <button type="button" class="pick" id="i-find">ค้นหาตำแหน่งจากที่อยู่นี้</button>
        <div class="hits" id="i-hits" hidden></div>
        <div class="tip" id="a-tip">พิมพ์อย่างน้อย ตำบล อำเภอ จังหวัด แล้วกดค้นหา ระบบจะปักหมุดให้</div>
      </div>
      <div class="pair">
        <div class="ff"><label for="i-prod">สินค้า <span class="req">*</span></label><select id="i-prod"></select></div>
        <div class="ff"><label for="i-model">รุ่น</label><input id="i-model" type="text" placeholder="เช่น KW-500"></div>
      </div>
      <div class="ff" id="w-brand" hidden><label for="i-brand">ยี่ห้อ (รถแทรกเตอร์คู่แข่ง)</label><select id="i-brand"></select></div>
      <div class="ff"><label for="i-ssc">SSC</label><select id="i-ssc"></select></div>
      <div class="pair">
        <div class="ff"><label for="i-prov">จังหวัด</label><input id="i-prov" type="text" placeholder="เช่น พิษณุโลก" list="prov-list"></div>
        <div class="ff"><label for="i-zone">เขต</label><select id="i-zone"></select></div>
      </div>
      <datalist id="prov-list"></datalist>
      <div class="ff">
        <label>ตำแหน่งบนแผนที่ <span class="req">*</span></label>
        <button type="button" class="btn gps" id="i-gps">ใช้ตำแหน่งปัจจุบันของฉัน (GPS)</button>
        <button type="button" class="pick" id="i-pick">หรือคลิกปักหมุดบนแผนที่เอง</button>
        <div class="pair">
          <input id="i-lat" type="number" step="any" placeholder="ละติจูด" class="num">
          <input id="i-lng" type="number" step="any" placeholder="ลองจิจูด" class="num">
        </div>
        <div class="tip" id="i-tip">กด GPS เพื่อปักตรงที่คุณอยู่ · หรือคลิกบนแผนที่ · หรือพิมพ์พิกัดเอง</div>
      </div>
    </div>
    <div class="sheet-f">
      <button class="btn danger" id="i-del" hidden>ลบ</button>
      <span style="flex:1"></span>
      <button class="btn" id="i-cancel">ยกเลิก</button>
      <button class="btn primary" id="i-save" style="padding:9px 20px">บันทึก</button>
    </div>
  </div>
</div>

<div class="ask" id="ask">
  <div class="ask-box">
    <p id="ask-msg"></p>
    <div class="btn-row"><button class="btn" id="ask-no">ยกเลิก</button><button class="btn danger" id="ask-yes">ยืนยัน</button></div>
  </div>
</div>

let DATA = [], MODE = "sheet", busy = false;

function apiBase() {
  if (API_URL && API_URL.indexOf("http") === 0) return API_URL;
  try { return localStorage.getItem("sscApiUrl") || ""; } catch (e) { return ""; }
}

// เรียกเซิร์ฟเวอร์แบบ JSONP — ใช้ได้ข้ามโดเมนโดยไม่ติดข้อจำกัด CORS
let cbN = 0;
function api(action, params) {
  const base = apiBase();
  return new Promise((resolve, reject) => {
    if (!base) return reject(new Error("ยังไม่ได้ตั้งค่าลิงก์เซิร์ฟเวอร์"));
    const cb = "__sscCb" + (++cbN);
    const el = document.createElement("script");
    let done = false;
    const timer = setTimeout(() => finish(new Error("เซิร์ฟเวอร์ไม่ตอบสนอง (ลองใหม่อีกครั้ง)")), 40000);
    function finish(err, val) {
      if (done) return; done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      if (el.parentNode) el.parentNode.removeChild(el);
      err ? reject(err) : resolve(val);
    }
    window[cb] = res => {
      if (res && res.ok) finish(null, res.data);
      else finish(new Error((res && res.error) || "เกิดข้อผิดพลาดที่เซิร์ฟเวอร์"));
    };
    const q = new URLSearchParams(Object.assign({ action, callback: cb }, params || {}));
    el.src = base + (base.indexOf("?") < 0 ? "?" : "&") + q.toString();
    el.onerror = () => finish(new Error("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบลิงก์และการตั้งค่าสิทธิ์"));
    document.head.appendChild(el);

function centroid(ring) {
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [x0, y0] = ring[j], [x1, y1] = ring[i];
    const f = x0 * y1 - x1 * y0;
    a += f; cx += (x0 + x1) * f; cy += (y0 + y1) * f;
  }
  a *= 0.5;
  if (!a) {
    const m = ring.reduce((s, p) => [s[0] + p[0], s[1] + p[1]], [0, 0]);
    return [m[1] / ring.length, m[0] / ring.length];
  }
  return [cy / (6 * a), cx / (6 * a)];
}

const LABELS = [];
provLayer.eachLayer(l => {
  const name = l.feature.properties.name;
  const at = centroid(l.feature.geometry.coordinates[0]);
  const mk = L.marker(at, {
    pane: "labels", interactive: false, keyboard: false,
    icon: L.divIcon({ className: "plabel", html: `<b>${name}</b>`, iconSize: [0, 0] })
  });
  LABELS.push({ name, mk, poly: l, shown: false });
});

function tuneLabels() {
  const pane = map.getPane("labels");
  if (!pane) return;                 // ยังตั้งค่าไม่เสร็จ (ถูกเรียกตอนจัดกรอบครั้งแรก)
  const z = map.getZoom();
  const size = z < 6.6 ? "sm" : z < 8.2 ? "md" : "lg";
  pane.classList.remove("labels-sm", "labels-md", "labels-lg");
  pane.classList.add("labels-" + size);
  const fs = size === "sm" ? 8.5 : size === "md" ? 10.5 : 12.5;

  const view = map.getBounds();
  const placed = [];
  const boxOf = o => {
    const w = o.name.length * fs * 0.62, h = fs * 1.25;
    return { x1: o.pt.x - w / 2 - 3, x2: o.pt.x + w / 2 + 3, y1: o.pt.y - h / 2 - 2, y2: o.pt.y + h / 2 + 2 };
  };
  const clashes = b => placed.some(p => !(b.x2 < p.x1 || b.x1 > p.x2 || b.y2 < p.y1 || b.y1 > p.y2));

  const cands = [];
  LABELS.forEach(o => {
    o.want = false;
    const bb = o.poly.getBounds();
    if (!view.intersects(bb)) return;
    const nw = map.latLngToContainerPoint(bb.getNorthWest());
    const se = map.latLngToContainerPoint(bb.getSouthEast());
    if (se.x - nw.x < 14 || se.y - nw.y < 11) return;   // จังหวัดเล็กเกินกว่าจะใส่ชื่อ
    o.area = (se.x - nw.x) * (se.y - nw.y);
    o.pt = map.latLngToContainerPoint(o.mk.getLatLng());
    cands.push(o);
  });
  // จังหวัดใหญ่ (และจังหวัดที่กำลังถูกเลือก) ได้สิทธิ์แสดงชื่อก่อน
  cands.sort((a, b) => (b.forced ? Infinity : b.area) - (a.forced ? Infinity : a.area));
  cands.forEach(o => {
    const b = boxOf(o);
    if (!o.forced && clashes(b)) return;
    placed.push(b); o.want = true;
  });

  LABELS.forEach(o => {
    if (o.want === o.shown) return;
    o.shown = o.want;
    o.want ? o.mk.addTo(map) : map.removeLayer(o.mk);
  });
}
map.on("zoomend moveend", tuneLabels);

    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }

  $("pinning").classList.add("on"); map.getContainer().style.cursor = "crosshair";
};
function stopPick() { picking = false; $("pinning").classList.remove("on"); map.getContainer().style.cursor = ""; }
$("pin-x").onclick = () => { stopPick(); $("veil").classList.add("on"); };
map.on("click", e => {
  if (!picking) return;
  $("i-lat").value = e.latlng.lat.toFixed(6); $("i-lng").value = e.latlng.lng.toFixed(6);
  markPicked(); showGhost(e.latlng.lat, e.latlng.lng); setTip("ปักหมุดตามที่คลิกแล้ว", "ok");
  stopPick(); $("veil").classList.add("on");
  fillAddrFrom(e.latlng.lat, e.latlng.lng);
});

/* ---------------- ค้นหาตำแหน่งจากที่อยู่ (ข้อมูลจาก OpenStreetMap) ----------------
   ปฏิบัติตามกติกาของ Nominatim: ค้นเมื่อกดปุ่มเท่านั้น (ไม่ค้นทุกตัวอักษร),
   เว้นระยะอย่างน้อย 1 วินาทีต่อครั้ง, และจำผลลัพธ์เดิมไว้ไม่ให้ถามซ้ำ            */
const GEO_URL = "https://nominatim.openstreetmap.org/";
let geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem("sscGeoCache") || "{}"); } catch (e) {}
let geoLast = 0;

async function geoFetch(path, params) {
  const key = path + "?" + new URLSearchParams(params).toString();
  if (geoCache[key]) return geoCache[key];
  const wait = 1100 - (Date.now() - geoLast);
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  geoLast = Date.now();
  const r = await fetch(GEO_URL + key);
  if (!r.ok) throw new Error("บริการค้นหาที่อยู่ตอบกลับผิดปกติ (" + r.status + ")");
  const j = await r.json();
  geoCache[key] = j;
  try { localStorage.setItem("sscGeoCache", JSON.stringify(geoCache)); } catch (e) {}
  return j;
}
const geoSearch  = q => geoFetch("search",  { q, format: "jsonv2", countrycodes: "th", limit: 6, addressdetails: 1, "accept-language": "th" });
const geoReverse = (lat, lng) => geoFetch("reverse", { lat, lon: lng, format: "jsonv2", zoom: 18, addressdetails: 1, "accept-language": "th" });

/* ตัด "ประเทศไทย" กับรหัสไปรษณีย์ท้ายที่อยู่ออก ให้อ่านง่ายขึ้น */
function tidyAddr(s) {
  return String(s || "").split(",").map(x => x.trim())
    .filter(x => x && x !== "ประเทศไทย" && x !== "Thailand" && !/^\d{5}$/.test(x))
    .join(" ");
}
/* ดึงชื่อจังหวัดจากผลลัพธ์ ตัดคำว่า "จังหวัด" ออก */
function provOf(a) {
  const v = (a && (a.province || a.state || a.city)) || "";
  return String(v).replace(/^จังหวัด\s*/, "").trim();
}
function setATip(msg, kind) { const t = $("a-tip"); t.textContent = msg; t.className = "tip" + (kind ? " " + kind : ""); }
function hideHits() { const h = $("i-hits"); h.hidden = true; h.innerHTML = ""; }

function usePlace(lat, lng, addr, prov) {
  $("i-lat").value = (+lat).toFixed(6);
  $("i-lng").value = (+lng).toFixed(6);
  markPicked(); showGhost(+lat, +lng);
  map.setView([+lat, +lng], baseMode === "streets" ? 16 : 12);
  if (addr) $("i-addr").value = addr;
  if (prov && !$("i-prov").value.trim()) $("i-prov").value = prov;
  hideHits();
  setTip("ปักหมุดตามที่อยู่แล้ว — ถ้าคลาดเคลื่อน ปรับด้วยการคลิกบนแผนที่ได้", "ok");
}

$("i-find").onclick = async () => {
  const q = $("i-addr").value.trim();
  if (q.length < 6) { setATip("พิมพ์ที่อยู่ให้ละเอียดกว่านี้ อย่างน้อยควรมี ตำบล อำเภอ จังหวัด", "bad"); return; }
  const b = $("i-find");
  b.disabled = true; b.textContent = "กำลังค้นหา…"; hideHits();
  setATip("กำลังค้นหาที่อยู่นี้บนแผนที่…");
  try {
    const list = await geoSearch(q);
    if (!list.length) { setATip("ไม่พบที่อยู่นี้ — ลองตัดบ้านเลขที่ออก เหลือแค่ ตำบล อำเภอ จังหวัด", "bad"); return; }
    const h = $("i-hits");
    h.innerHTML = "";
    list.forEach(p => {
      const parts = String(p.display_name || "").split(",").map(x => x.trim());
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "hit";
      const head = document.createElement("b"); head.textContent = parts[0] || "ตำแหน่ง";
      const rest = document.createElement("span"); rest.textContent = tidyAddr(parts.slice(1).join(", "));
      btn.appendChild(head); btn.appendChild(rest);
      btn.onclick = () => usePlace(p.lat, p.lon, tidyAddr(p.display_name), provOf(p.address));
      h.appendChild(btn);
    });
    h.hidden = false;
    setATip(list.length === 1 ? "พบ 1 ที่ — กดเพื่อปักหมุด" : `พบ ${list.length} ที่ — กดเลือกที่ที่ใช่`, "ok");
  } catch (e) {
    setATip("ค้นหาที่อยู่ไม่ได้ (ต้องต่ออินเทอร์เน็ต) — ปักหมุดบนแผนที่แทนได้", "bad");
  } finally { b.disabled = false; b.textContent = "ค้นหาตำแหน่งจากที่อยู่นี้"; }
};

/* ปักหมุดแล้วยังไม่ได้กรอกที่อยู่ → ดึงที่อยู่จากพิกัดมาเติมให้ */
async function fillAddrFrom(lat, lng) {
  if ($("i-addr").value.trim()) return;
  setATip("กำลังอ่านที่อยู่จากตำแหน่งนี้…");
  try {
    const r = await geoReverse(lat, lng);
    if (r && r.display_name) {
      $("i-addr").value = tidyAddr(r.display_name);
      const pv = provOf(r.address);
      if (pv && !$("i-prov").value.trim()) $("i-prov").value = pv;
      setATip("เติมที่อยู่จากตำแหน่งให้แล้ว ตรวจสอบและแก้ไขได้", "ok");
    } else setATip("อ่านที่อยู่จากตำแหน่งนี้ไม่ได้ พิมพ์เองได้เลย");
  } catch (e) { setATip("อ่านที่อยู่อัตโนมัติไม่ได้ พิมพ์เองได้เลย"); }
}

/* ---------------- ฟอร์ม ---------------- */
let editId = null;
function openForm(id) {
  editId = id || null;
  const c = id ? find(id) : null;
  $("sheet-title").textContent = c ? "แก้ไขข้อมูลลูกค้า" : "เพิ่มลูกค้าใหม่";
  $("i-name").value = c ? c.name : "";
  $("i-phone").value = c ? c.phone || "" : "";
  $("i-addr").value = c ? c.address || "" : "";
  hideHits();
  setATip("พิมพ์อย่างน้อย ตำบล อำเภอ จังหวัด แล้วกดค้นหา ระบบจะปักหมุดให้");
  $("i-find").disabled = false; $("i-find").textContent = "ค้นหาตำแหน่งจากที่อยู่นี้";
  $("i-prod").value = c ? c.product : Object.keys(PRODUCTS)[0];
  $("i-model").value = c ? c.model || "" : "";
  $("i-brand").value = c && c.brand && BRANDS[c.brand] ? c.brand : "อื่นๆ";
  syncBrandField();
  $("i-ssc").value = c ? c.ssc || SSC_LIST[0] : SSC_LIST[0];
  $("i-prov").value = c ? c.province || "" : "";
  $("i-zone").value = c ? c.zone || ZONES[0] : ZONES[0];
  $("i-lat").value = c ? c.lat : "";
  $("i-lng").value = c ? c.lng : "";
  $("w-name").classList.remove("bad"); $("m-name").classList.remove("on");
  $("i-gps").disabled = false; $("i-gps").textContent = "ใช้ตำแหน่งปัจจุบันของฉัน (GPS)";
  clearGhost();
  const p = $("i-pick");
  if (c) { markPicked(); showGhost(c.lat, c.lng); setTip("เปลี่ยนตำแหน่งได้ด้วย GPS, คลิกบนแผนที่ หรือพิมพ์พิกัด"); }
  else { p.classList.remove("set"); p.textContent = "หรือคลิกปักหมุดบนแผนที่เอง"; setTip("กด GPS เพื่อปักตรงที่คุณอยู่ · หรือคลิกบนแผนที่ · หรือพิมพ์พิกัดเอง"); }
  $("i-del").hidden = !c;
  $("veil").classList.add("on");
  setTimeout(() => $("i-name").focus({ preventScroll: true }), 40);
}
function closeForm() {
  $("veil").classList.remove("on"); stopPick(); clearGhost();
  // กันหน้าจอเลื่อนค้างหลังปิดฟอร์ม (เกิดได้บนมือถือ)
  document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
}
$("add").onclick = () => openForm(null);
$("sheet-x").onclick = $("i-cancel").onclick = closeForm;
$("i-del").onclick = () => editId && remove(editId);
$("i-name").oninput = () => { $("w-name").classList.remove("bad"); $("m-name").classList.remove("on"); };
[$("i-lat"), $("i-lng")].forEach(el => el.oninput = () => {
  const a = parseFloat($("i-lat").value), b = parseFloat($("i-lng").value);
  if (!isNaN(a) && !isNaN(b)) { setTip("ใช้พิกัดที่พิมพ์เอง", "ok"); showGhost(a, b); }
});
function formRec() { return { product: $("i-prod").value, brand: $("i-brand").value }; }
function syncBrandField() { $("w-brand").hidden = !isRival({ product: $("i-prod").value }); }
$("i-prod").onchange = $("i-brand").onchange = () => {
  syncBrandField();
  const a = parseFloat($("i-lat").value), b = parseFloat($("i-lng").value);
  if (!isNaN(a) && !isNaN(b)) showGhost(a, b);
};
addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("ask").classList.contains("on")) askClose();
  else if (picking) { stopPick(); $("veil").classList.add("on"); }
  else if ($("veil").classList.contains("on")) closeForm();
});

$("i-save").onclick = async () => {
  const name = $("i-name").value.trim();
  const lat = parseFloat($("i-lat").value), lng = parseFloat($("i-lng").value);
  if (!name) {
    $("w-name").classList.add("bad"); $("m-name").classList.add("on"); $("i-name").focus({ preventScroll: true });
    toast("กรุณากรอกชื่อลูกค้า", "bad"); return;
  }
  if (isNaN(lat) || isNaN(lng)) {
    setTip("ยังไม่ได้ระบุตำแหน่ง — กด GPS, คลิกบนแผนที่ หรือพิมพ์พิกัด", "bad");
    $("i-gps").scrollIntoView({ block: "center", behavior: "smooth" });
    toast("กรุณาระบุตำแหน่งบนแผนที่", "bad"); return;
  }
  const rec = {
    name, phone: $("i-phone").value.trim(), address: $("i-addr").value.trim(),
    product: $("i-prod").value,
    brand: isRival({ product: $("i-prod").value }) ? $("i-brand").value : "",
    model: $("i-model").value.trim(), ssc: $("i-ssc").value,
    province: $("i-prov").value.trim(), zone: $("i-zone").value, lat, lng
  };
  const isNew = !editId;
  const btn = $("i-save"); btn.disabled = true; btn.textContent = "กำลังบันทึก…";
  try {
    const res = isNew
      ? await api("add", { rec: JSON.stringify(rec) })
      : await api("update", { id: editId, rec: JSON.stringify(rec) });
    DATA = res.all;
    const savedId = res.id || editId;
    closeForm(); render(); select(savedId);
    toast(isNew ? `เพิ่ม "${name}" แล้ว · ทีมเห็นแล้ว` : "บันทึกการแก้ไขแล้ว · ทีมเห็นแล้ว", "ok");
  } catch (e) {
    toast("บันทึกไม่สำเร็จ: " + (e.message || "ลองใหม่อีกครั้ง"), "bad");
  } finally { btn.disabled = false; btn.textContent = "บันทึก"; }
};

function remove(id) {
  const c = find(id); if (!c) return;
  ask(`ต้องการลบลูกค้า "${c.name}" ใช่หรือไม่?`, async () => {
    setBusy(true);
    try {
      const res = await api("delete", { id });
      DATA = res.all;
      if (curId === id) { curId = null; $("card").classList.remove("on"); litProvince(null); }
      closeForm(); render();
      toast(`ลบ "${c.name}" แล้ว`, "ok");
    } catch (e) { toast("ลบไม่สำเร็จ: " + (e.message || ""), "bad"); }
    finally { setBusy(false); }
  });
}

/* ---------------- นำเข้า / ส่งออก / ชีต ---------------- */
$("refresh").onclick = () => reload(false);
$("opensheet").onclick = async () => {
  try { const r = await api("url"); window.open(r.url, "_blank"); }
  catch (e) { toast("เปิดชีตไม่ได้: " + (e.message || ""), "bad"); }
};
$("exp").onclick = () => {
  if (!DATA.length) return toast("ยังไม่มีข้อมูลให้ส่งออก", "bad");
  const text = JSON.stringify(DATA.map(({ id, ...r }) => r), null, 2);
  try {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = "customers.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast("ส่งออกข้อมูลแล้ว", "ok");
  } catch (e) { toast('ดาวน์โหลดไม่ได้ — กด "เปิดชีต" แล้วโหลดจาก Google Sheets แทน', "bad"); }
};
$("imp").onclick = () => $("file").click();
$("file").onchange = ev => {
  const f = ev.target.files[0]; if (!f) return;
  const rdr = new FileReader();
  rdr.onload = () => {
    let rows;
    try {
      rows = JSON.parse(rdr.result);
      if (!Array.isArray(rows)) throw new Error("รูปแบบไฟล์ไม่ถูกต้อง");
    } catch (e) { toast("นำเข้าไม่สำเร็จ: " + e.message, "bad"); ev.target.value = ""; return; }
    ask(`นำเข้าลูกค้า ${rows.length} ราย และแทนที่ข้อมูลทั้งหมดของทีม?`, async () => {
      setBusy(true);
      try {
        await api("clear");
        const SIZE = 12;                       // ส่งทีละก้อนเล็ก ๆ กันลิงก์ยาวเกิน
        let res = { all: [] };
        for (let i = 0; i < rows.length; i += SIZE) {
          const part = rows.slice(i, i + SIZE);
          res = await api("addMany", { rows: JSON.stringify(part) });
          toast(`กำลังนำเข้า ${Math.min(i + SIZE, rows.length)}/${rows.length}…`);
        }
        DATA = res.all; curId = null; $("card").classList.remove("on"); render();
        toast(`นำเข้า ${rows.length} ราย สำเร็จ`, "ok");
      } catch (e) { toast("นำเข้าไม่สำเร็จ: " + (e.message || ""), "bad"); await reload(true); }
      finally { setBusy(false); }
    });
    ev.target.value = "";
  };
  rdr.readAsText(f);
};

/* ---------------- แถบรายชื่อบนมือถือ ---------------- */
$("grab").onclick = () => {
  const r = $("rail"); r.classList.toggle("tuck");
  $("grab").textContent = r.classList.contains("tuck") ? "▲ รายชื่อลูกค้า" : "▼ ซ่อนรายชื่อ";
};
if (innerWidth <= 820) $("rail").classList.add("tuck");

/* ---------------- เริ่มทำงาน ---------------- */
window.__cp = 9;
drawLegend();
render();
initStore().then(() => { render(); frame(); });
addEventListener("focus", () => { if (!busy && !$("veil").classList.contains("on") && !document.getElementById("setup")) reload(true); });
window.__appRan = 1;
</script>
<script>
window.__fileEnd = 1;
(function () {
  function row(parent, ok, label) {
    var d = document.createElement("div");
    d.textContent = (ok ? "\u2705 " : "\u274C ") + label;
    parent.appendChild(d);
  }
  function report() {
    if (document.getElementById("diag")) return;
    var box = document.createElement("div");
    box.id = "diag";
    var st = box.style;
    st.position = "fixed"; st.top = "0"; st.left = "0"; st.right = "0";
    st.maxHeight = "70vh"; st.overflow = "auto"; st.zIndex = "99999";
    st.background = "#1b242e"; st.color = "#e8eef4";
    st.padding = "14px 48px 14px 16px";
    st.font = "13px/1.7 system-ui, sans-serif";

    var h = document.createElement("b");
    h.textContent = "รายงานอาการของแอป";
    h.style.fontSize = "15px";
    box.appendChild(h);

    var list = document.createElement("div");
    list.style.marginTop = "8px";
    row(list, !!window.__fileEnd, "โค้ดครบทั้งไฟล์");
    row(list, !!window.__appRan, "แอปเริ่มทำงานจนจบ");
    row(list, typeof L !== "undefined", "ไลบรารีแผนที่ (Leaflet)");
    row(list, !!(window.google && window.google.script && window.google.script.run), "เชื่อมต่อ Apps Script");
    row(list, !!document.getElementById("f-zone"), "โครงหน้าเว็บครบ");
    var cp = document.createElement("div");
    cp.textContent = "\u27A1\uFE0F ทำงานถึงจุดตรวจที่ " + (window.__cp || 0) + " จาก 9";
    cp.style.marginTop = "6px";
    cp.style.color = "#ffd479";
    list.appendChild(cp);
    box.appendChild(list);

    var errs = window.__err || [];
    var sec = document.createElement("div");
    sec.style.marginTop = "10px";
    sec.style.paddingTop = "10px";
    sec.style.borderTop = "1px solid #33404d";
    var t = document.createElement("b");
    t.textContent = errs.length ? "ข้อผิดพลาดที่พบ" : (window.__err ? "ไม่มี error (สคริปต์หยุดเงียบ ๆ)" : "ตัวเก็บ error ไม่ได้ทำงาน");
    sec.appendChild(t);
    for (var i = 0; i < errs.length; i++) {
      var c = document.createElement("div");
      c.textContent = errs[i];
      c.style.color = "#ffb4b0";
      c.style.fontFamily = "monospace";
      c.style.wordBreak = "break-word";
      sec.appendChild(c);
    }
    box.appendChild(sec);

    var hint = document.createElement("div");
    hint.textContent = "ถ่ายรูปหน้านี้ส่งให้ผู้ดูแลเพื่อแก้ไขได้เลย";
    hint.style.marginTop = "10px";
    hint.style.color = "#a8b8c6";
    hint.style.fontSize = "12px";
    box.appendChild(hint);

    var x = document.createElement("button");
    x.type = "button";
    x.textContent = "\u00D7";
    var xs = x.style;
    xs.position = "absolute"; xs.top = "10px"; xs.right = "10px";
    xs.width = "28px"; xs.height = "28px"; xs.border = "0"; xs.borderRadius = "7px";
    xs.background = "#33404d"; xs.color = "#fff"; xs.fontSize = "16px"; xs.cursor = "pointer";
    x.onclick = function () { box.parentNode && box.parentNode.removeChild(box); };
    box.appendChild(x);

    document.body.appendChild(box);
  }
  window.__diag = report;
  setTimeout(function () { if (!window.__appRan) report(); }, 8000);
})();
</script>
